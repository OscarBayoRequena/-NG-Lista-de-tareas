  <div class="main-container">
    <header>
      <h2 class="main-title">Lista de tareas</h2>
      <div class="counters-container">
        <div class="counter-item">
          <span class="counter-number all">{{ allTasks.length }}</span
          ><span>Totales:</span>
        </div>
        <div class="counter-item">
          <span class="counter-number completed">{{ completedTasks }}</span
          ><span>Completadas:</span>
        </div>
        <div class="counter-item">
          <span class="counter-number remaining">{{ pendingTasks }}</span
          ><span>Restantes: </span>
        </div>
      </div>
    </header>
    <app-task-form
      [filter]="currFilter"
      (addTask)="addTask($event)"
      (changeFilter)="changeFilter($event)"
    ></app-task-form>
    <app-task-list
      [tasks]="filteredTasks"
      (toggleTask)="toggleDone($event)"
      (deleteTask)="removeTask($event)"
    ></app-task-list>
  </div>
</main>
