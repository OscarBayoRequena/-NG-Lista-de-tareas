<div class="main-container">
  <header>
    <h2 class="main-title">Lista de tareas</h2>
    <div class="counters-container">
      <div class="counter-item">
        <span class="counter-number all">{{ tareas.length }}</span
        ><span>Totales:</span>
      </div>
      <div class="counter-item">
        <span class="counter-number completed">{{ completedTareas() }}</span
        ><span>Completadas:</span>
      </div>
      <div class="counter-item">
        <span class="counter-number remaining">{{ remainingTareas() }}</span
        ><span>Restantes: </span>
      </div>
    </div>
  </header>
  <form class="list-container" (submit)="$event.preventDefault(); onSubmit()">
    <section id="input-section" class="list-section">
      <input
        #taskInput
        type="text"
        name="addTask"
        id="addTaskField"
        placeholder="Añade tu tarea aquí"
        [value]="tareaInput"
        (input)="tareaInput = taskInput.value"
      />
      <button id="addTaskButton" type="submit">Add task</button>
    </section>
    <section id="filter-section" class="list-section">
      <!--
      <select #taskFilter name="filter" id="filter" (change)="changeFilter(taskFilter.value)">
        <option value="all">Todas</option>
        <option value="completed">Completadas</option>
        <option value="remaining">Pendientes</option>
      </select>
      -->
      <div class="filter-option">
        <label for="allRadio">
          Todas
          <input
            [checked]="currFilter === 'all'"
            #allRadio
            type="radio"
            id="allRadio"
            name="filter"
            value="all"
            (change)="changeFilter(allRadio.value)"
          />
        </label>
      </div>
      <div class="filter-option">
        <label for="completedRadio">
          Completadas
          <input
            [checked]="currFilter === 'completed'"
            #completedRadio
            type="radio"
            id="completedRadio"
            name="filter"
            value="completed"
            (change)="changeFilter(completedRadio.value)"
          />
        </label>
      </div>
      <div class="filter-option">
        <label for="remainingRadio">
          Pendientes
          <input
            [checked]="currFilter === 'remaining'"
            #remainingRadio
            type="radio"
            id="remainingRadio"
            name="filter"
            value="remaining"
            (change)="changeFilter(remainingRadio.value)"
          />
        </label>
      </div>
    </section>
    <section id="tasks-section" class="list-section">
      @for (tarea of tareasFiltradas; track tarea.id) {
        <div [id]="'task-' + tarea.id" class="task-item">
          <div class="task-controls">
            <input
              class="tarea-checkbox"
              type="checkbox"
              [checked]="tarea.status"
              (change)="toggleStatus(tarea.id)"
              [attr.aria-label]="'Completar: ' + tarea.text"
            />
          </div>
          <span class="tarea-text">{{ tarea.text }}</span>

          <div class="task-controls">
            <button
              class="tarea-delete"
              type="button"
              [name]="'removeTask' + tarea.id"
              [id]="'removeTask' + tarea.id"
              (click)="removeTarea(tarea.id)"
              [attr.aria-label]="'Borrar tarea: ' + tarea.text"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <line x1="6" y1="6" x2="18" y2="18" />
                <line x1="18" y1="6" x2="6" y2="18" />
              </svg>
            </button>
          </div>
        </div>
      }
    </section>
  </form>
</div>
